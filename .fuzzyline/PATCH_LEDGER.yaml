# Core patch ledger for Bambuddy farm customization.
# Records intentional patches to upstream-owned files that must be reviewed when upstream changes.
patches:
  - id: WP-082-swapmod-scheduler-handoff-chain
    date: 2026-06-30
    workpack: workpacks/exec/WP-082_SWAPMOD_SCHEDULER_HANDOFF_CHAIN.md
    files:
      - backend/app/services/print_scheduler.py
    upstream_area: PrintScheduler._start_print
    reason: >-
      Ensure the WP-079 latest-print gate and WP-081 queue-readiness binding gate
      describe the same SwapMod source print run and cycle before scheduler upload,
      queue status mutation, bed-clear state mutation, or printer start.
    behavior: >-
      When both existing default-off scheduler gates are enforced and their
      source print run or source cycle identity differs, _start_print logs
      scheduler_handoff_source_print_run_mismatch and/or
      scheduler_handoff_source_cycle_mismatch and returns False before external
      printer boundaries are reached.
    feature_flags:
      - FARM_SWAPMOD_SCHEDULER_NEXT_PRINT_GATE_ENABLED=false
      - FARM_SWAPMOD_SCHEDULER_QUEUE_READINESS_BINDING_ENABLED=false
      - FARM_BED_AUTOMATION_ENABLED=false
    rollback: >-
      Disable the existing scheduler gates or revert this WP-082 scheduler guard
      and tests. No database migration or public API rollback is required.
    validation:
      - make test-swapmod-scheduler-handoff-chain
      - make test-swapmod-scheduler-queue-readiness-binding
      - make test-swapmod-queue-readiness-binding
      - make test-swapmod-scheduler-next-print-gate
      - make verify-fast
      - python3 harness/scripts/check_workpack.py workpacks/exec/WP-082_SWAPMOD_SCHEDULER_HANDOFF_CHAIN.md
      - git diff --check
  - id: upstream-v0.2.4.9-fail-closed-plate-clear-default
    date: 2026-07-13
    workpack: workpacks/exec/UPSTREAM_V0_2_4_9_INTEGRATION.md
    files:
      - backend/app/services/print_scheduler.py
      - backend/app/schemas/settings.py
      - frontend/src/pages/SettingsPage.tsx
    upstream_area: Scheduler plate-clear setting defaults
    reason: >-
      Upstream v0.2.4.9 changes an unset require_plate_clear setting to false,
      which conflicts with the farm invariant that no next print starts until
      bed readiness is verified.
    behavior: >-
      An absent require_plate_clear setting resolves to true in the scheduler,
      settings schema, and Settings UI. An explicitly stored false value remains
      supported, so this patch changes only the missing-setting default.
    rollback: >-
      Revert this ledger entry and the three default-value changes only after an
      operator explicitly changes the farm bed-readiness invariant. No database
      migration is required.
    validation:
      - python3 -m unittest harness.tests.test_upstream_scheduler_safety
      - docker compose -f docker-compose.test.yml run --rm backend-test
      - npm --prefix frontend run test:run
      - make verify-full FRONTEND_TESTED=1
  - id: WP-110-supervised-swapmod-printer-card-control
    date: 2026-07-14
    workpack: workpacks/exec/WP-110_SWAPMOD_CONTROL_UI.md
    files:
      - backend/app/core/config.py
      - backend/app/api/routes/swapmod_a1mini_direct_canary.py
      - backend/app/services/swapmod_a1mini_direct_canary.py
      - frontend/src/api/client.ts
      - frontend/src/components/swapmod/SwapModPlateChangeControl.tsx
      - frontend/src/pages/PrintersPage.tsx
    upstream_area: Printer card composition and supervised SwapMod direct-canary control
    reason: >-
      Replace the curl-only supervised plate-change procedure with an operator
      control while preserving the WP-076 named-canary, allowlisted-sequence,
      checklist, exact-phrase, manual-verification, and no-auto-resume gates.
    behavior: >-
      The control renders only for the configured, connected, controllable A1
      Mini canary while both default-off flags are armed. It creates no cycle
      until all server-provided checklist items are checked, trusts only
      acknowledged server states, and stops for manual review on command
      failure, uncertain response, stale state, or another unresolved cycle. The
      backend serializes each named-printer claim, refreshes state under the lock,
      commits an active transition before transport, then reclaims the printer
      lock and cycle row lock through send. It rechecks the printer immediately
      before sending the already hashed immutable sequence snapshot. The broader
      state-machine flag is also required.
    feature_flags:
      - FARM_SWAPMOD_A1MINI_DIRECT_CANARY_ENABLED=false
      - FARM_SWAPMOD_A1MINI_DIRECT_CANARY_ALLOW_REAL_COMMANDS=false
      - FARM_SWAPMOD_A1MINI_DIRECT_CANARY_TARGET_PRINTER_ID=
    rollback: >-
      Disable either direct-canary flag and revert the WP-110 Draft PR. The
      target-printer setting is additive, no migration exists, and uncertain
      cycles are never resumed or reset automatically; an already active cycle
      remains subject to manual reconciliation.
    validation:
      - npm --prefix frontend run test -- --run src/__tests__/components/SwapModPlateChangeControl.test.tsx
      - npm --prefix frontend run test -- --run
      - npm --prefix frontend run lint
      - npm --prefix frontend run build
      - make test-swapmod-a1mini-direct-canary
      - ephemeral PostgreSQL concurrent direct-canary audit (one synthetic send)
      - ephemeral PostgreSQL send-time cycle row-lock audit
      - make verify-fast FRONTEND_TESTED=1
      - make verify-full FRONTEND_TESTED=1
      - git diff --check
