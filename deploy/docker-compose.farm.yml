services:
  bambuddy:
    volumes:
      - ${FARM_BACKUP_DIR:?Set FARM_BACKUP_DIR in deploy/.env.farm}:/app/data/backups

  prometheus:
    profiles: ["farm-observability"]
    image: ${PROMETHEUS_IMAGE:?Set a pinned PROMETHEUS_IMAGE in deploy/.env.farm}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - farm_prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      farm_observability:
        aliases:
          - prometheus

  grafana:
    profiles: ["farm-observability"]
    image: ${GRAFANA_IMAGE:?Set a pinned GRAFANA_IMAGE in deploy/.env.farm}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env.farm}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13030}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - farm_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      farm_observability:
        aliases:
          - grafana

  ntfy:
    profiles: ["farm-observability"]
    image: ${NTFY_IMAGE:?Set a pinned NTFY_IMAGE in deploy/.env.farm}
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.farm.lan}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ENABLE_METRICS: "true"
      NTFY_LOG_LEVEL: ${NTFY_LOG_LEVEL:-info}
      NTFY_LOG_FORMAT: json
    ports:
      - "127.0.0.1:${NTFY_HTTP_PORT:-18080}:80"
    volumes:
      - farm_ntfy_data:/var/lib/ntfy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/v1/health | grep -q healthy
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      farm_observability:
        aliases:
          - ntfy

  caddy:
    profiles: ["farm-observability"]
    image: ${CADDY_IMAGE:?Set a pinned CADDY_IMAGE in deploy/.env.farm}
    restart: unless-stopped
    environment:
      BAMBUDDY_FARM_HOST: ${BAMBUDDY_FARM_HOST:-bambuddy.farm.lan}
      GRAFANA_FARM_HOST: ${GRAFANA_FARM_HOST:-grafana.farm.lan}
      NTFY_FARM_HOST: ${NTFY_FARM_HOST:-ntfy.farm.lan}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - farm_caddy_data:/data
      - farm_caddy_config:/config
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      grafana:
        condition: service_started
      ntfy:
        condition: service_started
    networks:
      farm_observability:
        aliases:
          - caddy

networks:
  farm_observability:

volumes:
  farm_prometheus_data:
  farm_grafana_data:
  farm_ntfy_data:
  farm_caddy_data:
  farm_caddy_config:
