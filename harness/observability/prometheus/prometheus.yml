global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Bambuddy /api/v1/metrics is disabled by default in product settings.
  # The local harness enables prometheus_enabled=true with an empty
  # prometheus_token during make harness-observability-health. If an operator
  # protects metrics with prometheus_token, add a local-only bearer_token_file
  # override instead of committing credentials here.
  - job_name: bambuddy
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - bambuddy:8000

  - job_name: mock-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - mock-services:9099

  - job_name: harness-observer
    metrics_path: /metrics
    static_configs:
      - targets:
          - harness-observer:9101
